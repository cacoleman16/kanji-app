<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Kanji Preview — Genki 2 Sample</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #27272a;
    --border: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --accent: #fbbf24;
    --accent-soft: rgba(251, 191, 36, 0.12);
    --good: #34d399;
    --again: #f87171;
    --font-jp: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    max-width: 520px;
    margin: 0 auto;
  }

  /* ---- Header ---- */
  header {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px 20px;
    font-size: 13px;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }
  .deck-name { font-weight: 500; }
  .progress { font-variant-numeric: tabular-nums; }

  .progress-bar {
    width: 100%;
    height: 3px;
    background: var(--surface);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 32px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    width: 20%;
    transition: width 300ms ease;
  }

  /* ---- Card ---- */
  .card-stage {
    flex: 1;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1600px;
    min-height: 440px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 520px;
    transform-style: preserve-3d;
    transition: transform 600ms cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
    user-select: none;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  }

  /* ---- Front ---- */
  .face-front {
    align-items: center;
    justify-content: center;
  }
  .kanji-huge {
    font-family: var(--font-jp);
    font-weight: 400;
    font-size: 280px;
    line-height: 1;
    color: var(--text);
    letter-spacing: -0.04em;
  }
  .tap-hint {
    position: absolute;
    bottom: 24px;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ---- Back ---- */
  .face-back {
    transform: rotateY(180deg);
    justify-content: flex-start;
    gap: 20px;
    overflow-y: auto;
  }
  .meaning {
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: 22px;
    color: var(--text);
    line-height: 1.3;
    text-align: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }
  .meaning .secondary {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 15px;
  }

  .examples {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .example {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 12px;
    align-items: baseline;
    font-size: 15px;
  }
  .example .ex-kanji {
    font-family: var(--font-jp);
    font-weight: 500;
    color: var(--text);
    min-width: 48px;
  }
  .example .ex-kana {
    font-family: var(--font-jp);
    color: var(--text-muted);
    font-size: 13px;
  }
  .example .ex-meaning {
    color: var(--text-muted);
    font-size: 13px;
    font-style: italic;
  }

  .readings {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 12px 14px;
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 14px;
  }
  .reading-row {
    display: flex;
    gap: 10px;
    align-items: baseline;
  }
  .reading-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    min-width: 28px;
  }
  .reading-value {
    font-family: var(--font-jp);
    color: var(--text);
  }

  .keyword-block {
    margin-top: auto;
    padding: 14px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .keyword-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .keyword {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    margin-bottom: 6px;
  }
  .etymology {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.45;
  }

  /* ---- Nav ---- */
  nav {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1.4fr 1fr;
    gap: 10px;
    margin-top: 24px;
  }
  button {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 12px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 150ms, border-color 150ms, transform 80ms;
  }
  button:hover { background: var(--surface-2); border-color: var(--text-dim); }
  button:active { transform: scale(0.98); }
  button.primary {
    background: var(--text);
    color: var(--bg);
    border-color: var(--text);
  }
  button.primary:hover { background: #d4d4d8; }

  footer {
    margin-top: 16px;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-align: center;
  }

  /* Smaller screens (phone) */
  @media (max-width: 480px) {
    .kanji-huge { font-size: 220px; }
    .card { height: 480px; }
  }
</style>
</head>
<body>

<header>
  <span class="deck-name" id="deck-name">Genki 2 — Preview</span>
  <span class="progress" id="progress">1 / 5</span>
</header>

<div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>

<div class="card-stage">
  <div class="card" id="card">
    <div class="face face-front">
      <span class="kanji-huge" id="front-kanji">昔</span>
      <span class="tap-hint">Tap to flip</span>
    </div>
    <div class="face face-back" id="back">
      <!-- populated by JS -->
    </div>
  </div>
</div>

<nav>
  <button id="prev-btn" aria-label="Previous">← Prev</button>
  <button class="primary" id="flip-btn">Flip</button>
  <button id="next-btn" aria-label="Next">Next →</button>
</nav>

<footer>Tap card to flip &nbsp;·&nbsp; ← → to navigate &nbsp;·&nbsp; Space to flip</footer>

<script>
const DATA = {
  "deck_name": "Genki 2 — Preview",
  "cards": [
    {
      "kanji": "昔",
      "meanings": ["long ago", "former times", "antiquity"],
      "on_yomi": ["セキ", "シャク"],
      "kun_yomi": ["むかし"],
      "examples": [
        { "kanji": "昔々", "kana": "むかしむかし", "meaning": "once upon a time" },
        { "kanji": "大昔", "kana": "おおむかし", "meaning": "ancient times" },
        { "kanji": "昔話", "kana": "むかしばなし", "meaning": "old tale, folklore" }
      ],
      "keyword": "antiquity",
      "etymology": "Twenty (廿) stacked over days (日) — twenty days have passed, meaning long ago."
    },
    {
      "kanji": "神",
      "meanings": ["god", "deity", "spirit"],
      "on_yomi": ["シン", "ジン"],
      "kun_yomi": ["かみ", "かん"],
      "examples": [
        { "kanji": "神社", "kana": "じんじゃ", "meaning": "Shinto shrine" },
        { "kanji": "神様", "kana": "かみさま", "meaning": "god (honorific)" },
        { "kanji": "精神", "kana": "せいしん", "meaning": "spirit, mind" }
      ],
      "keyword": "god",
      "etymology": "Altar (礻) beside lightning extending from the sky (申) — where the divine makes itself known."
    },
    {
      "kanji": "働",
      "meanings": ["to work", "to labor"],
      "on_yomi": ["ドウ"],
      "kun_yomi": ["はたら(く)"],
      "examples": [
        { "kanji": "働く", "kana": "はたらく", "meaning": "to work" },
        { "kanji": "労働", "kana": "ろうどう", "meaning": "labor, manual work" },
        { "kanji": "共働き", "kana": "ともばたらき", "meaning": "dual-income household" }
      ],
      "keyword": "work",
      "etymology": "A person (亻) who moves (動) — one who moves is one who works."
    },
    {
      "kanji": "別",
      "meanings": ["separate", "another", "different", "to part"],
      "on_yomi": ["ベツ"],
      "kun_yomi": ["わか(れる)"],
      "examples": [
        { "kanji": "別れる", "kana": "わかれる", "meaning": "to part, to separate" },
        { "kanji": "特別", "kana": "とくべつ", "meaning": "special" },
        { "kanji": "別々", "kana": "べつべつ", "meaning": "separately, individually" }
      ],
      "keyword": "separate",
      "etymology": "Another piece (另) and a knife (刂) — the knife divides one thing into another."
    },
    {
      "kanji": "度",
      "meanings": ["degree", "time (occurrence)", "extent"],
      "on_yomi": ["ド", "タク"],
      "kun_yomi": ["たび"],
      "examples": [
        { "kanji": "一度", "kana": "いちど", "meaning": "once, one time" },
        { "kanji": "今度", "kana": "こんど", "meaning": "this time; next time" },
        { "kanji": "温度", "kana": "おんど", "meaning": "temperature" }
      ],
      "keyword": "degree",
      "etymology": "Under a shelter (广), a hand (又) measures with a stick — a measured degree."
    }
  ]
};

const cardEl = document.getElementById('card');
const frontKanji = document.getElementById('front-kanji');
const backEl = document.getElementById('back');
const progressEl = document.getElementById('progress');
const progressFill = document.getElementById('progress-fill');
const flipBtn = document.getElementById('flip-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');

let idx = 0;
let flipped = false;

function renderBack(card) {
  const [primary, ...rest] = card.meanings;
  backEl.innerHTML = `
    <div class="meaning">
      ${primary}
      ${rest.length ? `<div class="secondary">${rest.join(' · ')}</div>` : ''}
    </div>
    <div class="examples">
      ${card.examples.map(ex => `
        <div class="example">
          <span class="ex-kanji">${ex.kanji}</span>
          <span class="ex-kana">${ex.kana}</span>
          <span class="ex-meaning">${ex.meaning}</span>
        </div>
      `).join('')}
    </div>
    <div class="readings">
      ${card.on_yomi.length ? `
        <div class="reading-row">
          <span class="reading-label">On</span>
          <span class="reading-value">${card.on_yomi.join(', ')}</span>
        </div>` : ''}
      ${card.kun_yomi.length ? `
        <div class="reading-row">
          <span class="reading-label">Kun</span>
          <span class="reading-value">${card.kun_yomi.join(', ')}</span>
        </div>` : ''}
    </div>
    <div class="keyword-block">
      <div class="keyword-label">Keyword</div>
      <div class="keyword">${card.keyword}</div>
      <div class="etymology">${card.etymology}</div>
    </div>
  `;
}

function render() {
  const card = DATA.cards[idx];
  frontKanji.textContent = card.kanji;
  renderBack(card);
  progressEl.textContent = `${idx + 1} / ${DATA.cards.length}`;
  progressFill.style.width = `${((idx + 1) / DATA.cards.length) * 100}%`;
  if (flipped) {
    cardEl.classList.remove('flipped');
    flipped = false;
  }
}

function flip() {
  flipped = !flipped;
  cardEl.classList.toggle('flipped', flipped);
}

function next() {
  if (idx < DATA.cards.length - 1) {
    idx++;
    render();
  }
}
function prev() {
  if (idx > 0) {
    idx--;
    render();
  }
}

cardEl.addEventListener('click', flip);
flipBtn.addEventListener('click', (e) => { e.stopPropagation(); flip(); });
nextBtn.addEventListener('click', (e) => { e.stopPropagation(); next(); });
prevBtn.addEventListener('click', (e) => { e.stopPropagation(); prev(); });

document.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); flip(); }
  else if (e.key === 'ArrowRight') { next(); }
  else if (e.key === 'ArrowLeft') { prev(); }
});

render();
</script>

</body>
</html>
