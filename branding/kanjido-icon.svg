<?xml version="1.0" encoding="UTF-8"?>
<!--
  Kanjido — placeholder app-icon master.
  1024×1024 SVG; ingestion-ready by pwa-asset-generator → /public/icons/*.png.

  Design intent (placeholder): warm-amber square, deep neutral background, the
  kanji 道 ("way / path") rendered in a thick brush style. Replace with your
  designer's master before App Store submission.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <filter id="ink" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur stdDeviation="1.2" />
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#bg)" />
  <!-- Accent square: 25% opacity of brand amber, gives the icon a "frame" feel -->
  <rect
    x="112"
    y="112"
    width="800"
    height="800"
    rx="160"
    ry="160"
    fill="none"
    stroke="#fbbf24"
    stroke-opacity="0.18"
    stroke-width="6"
  />
  <!-- 道 — "the way of" -->
  <text
    x="512"
    y="700"
    text-anchor="middle"
    font-family="'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', serif"
    font-size="640"
    font-weight="700"
    fill="#fbbf24"
    filter="url(#ink)"
  >道</text>
</svg>
