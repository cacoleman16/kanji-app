<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kanji" />
<meta name="theme-color" content="#09090b" />
<title>Kanji</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js"));</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #09090b;
    --surface: #18181b;
    --surface-2: #27272a;
    --surface-3: #3f3f46;
    --border: #3f3f46;
    --text: #fafafa;
    --text-muted: #a1a1aa;
    --text-dim: #71717a;
    --accent: #fbbf24;
    --accent-soft: rgba(251, 191, 36, 0.12);
    --good: #34d399;
    --good-soft: rgba(52, 211, 153, 0.12);
    --again: #f87171;
    --again-soft: rgba(248, 113, 113, 0.12);
    --hard: #fbbf24;
    --easy: #60a5fa;
    --font-jp: 'Noto Sans JP', 'Hiragino Sans', 'Yu Gothic', 'Meiryo', sans-serif;
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    -webkit-font-smoothing: antialiased;
  }

  body {
    overscroll-behavior: none;
  }

  #root {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* ---------- Shell ---------- */
  .shell {
    max-width: 520px;
    width: 100%;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 20px);
    flex: 1;
    display: flex;
    flex-direction: column;
    padding-top: max(env(safe-area-inset-top), 16px);
    padding-bottom: max(env(safe-area-inset-bottom), 20px);
  }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 8px;
    min-height: 52px;
  }
  .topbar-left, .topbar-right {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 60px;
  }
  .topbar-title {
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text-muted);
  }
  .icon-btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 20px;
    font-family: var(--font-ui);
    cursor: pointer;
    padding: 8px;
    margin: -8px;
    border-radius: 8px;
    transition: color 150ms;
  }
  .icon-btn:hover { color: var(--text); }

  /* ---------- Home ---------- */
  .home-header {
    padding: 20px 0 28px;
  }
  .greeting {
    font-size: 14px;
    color: var(--text-dim);
    margin-bottom: 4px;
    letter-spacing: 0.02em;
  }
  .big-title {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 24px;
  }

  .streak-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }
  .stat-label {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }
  .stat-value {
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .stat-unit {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 400;
    margin-left: 4px;
  }

  .daily-progress {
    margin-top: 8px;
  }
  .daily-bar {
    height: 4px;
    background: var(--surface-2);
    border-radius: 2px;
    overflow: hidden;
  }
  .daily-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    transition: width 300ms ease;
  }

  .section-label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 12px;
    margin-top: 8px;
  }

  .deck-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 24px;
  }
  .deck-card {
    appearance: none;
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 15px;
    cursor: pointer;
    transition: border-color 150ms, background 150ms, transform 80ms;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .deck-card:hover { background: var(--surface-2); border-color: var(--text-dim); }
  .deck-card:active { transform: scale(0.99); }
  .deck-card.disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }
  .deck-card.disabled:hover { background: var(--surface); border-color: var(--border); }
  .deck-name { font-weight: 500; }
  .deck-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 3px;
  }
  .deck-due {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }
  .deck-due.zero { color: var(--text-dim); }
  .deck-meta-right { text-align: right; }

  /* ---------- Study ---------- */
  .study-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0 16px;
  }
  .study-progress-text {
    font-size: 12px;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  .study-progress-bar {
    height: 3px;
    background: var(--surface);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .study-progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 300ms ease;
  }

  .card-stage {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1600px;
    min-height: 440px;
    padding: 4px;
  }

  .card {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: min(520px, 62vh);
    transform-style: preserve-3d;
    transition: transform 600ms cubic-bezier(0.4, 0.0, 0.2, 1);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
  }
  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
  }
  .face-front {
    align-items: center;
    justify-content: center;
  }
  .kanji-huge {
    font-family: var(--font-jp);
    font-weight: 400;
    font-size: clamp(180px, 44vw, 260px);
    line-height: 1;
    letter-spacing: -0.04em;
  }
  .tap-hint {
    position: absolute;
    bottom: 20px;
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .face-back {
    transform: rotateY(180deg);
    justify-content: flex-start;
    gap: 16px;
    overflow-y: auto;
  }
  .meaning {
    font-size: 20px;
    font-weight: 500;
    line-height: 1.3;
    text-align: center;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--border);
  }
  .meaning .secondary {
    color: var(--text-muted);
    font-weight: 400;
    font-size: 13px;
    margin-top: 4px;
  }
  .examples {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .example {
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 10px;
    align-items: baseline;
    font-size: 14px;
  }
  .ex-kanji { font-family: var(--font-jp); font-weight: 500; min-width: 44px; }
  .ex-kana { font-family: var(--font-jp); color: var(--text-muted); font-size: 12px; }
  .ex-meaning { color: var(--text-muted); font-size: 12px; font-style: italic; }

  .readings {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 10px;
    font-size: 13px;
  }
  .reading-row { display: flex; gap: 8px; align-items: baseline; }
  .reading-label {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    min-width: 26px;
  }
  .reading-value { font-family: var(--font-jp); }

  .keyword-block {
    margin-top: auto;
    padding: 12px;
    background: var(--accent-soft);
    border-left: 3px solid var(--accent);
    border-radius: 6px;
  }
  .keyword-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 4px;
  }
  .keyword {
    font-size: 15px;
    font-weight: 500;
    margin-bottom: 4px;
  }
  .etymology {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.45;
  }

  /* ---------- Rating Buttons ---------- */
  .rating-area {
    margin-top: 20px;
  }
  .rating-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .rating-btn {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 600;
    padding: 14px 8px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: transform 80ms, background 150ms, border-color 150ms;
    min-height: 64px;
  }
  .rating-btn:active { transform: scale(0.97); }
  .rating-btn.again { color: var(--again); border-color: rgba(248, 113, 113, 0.35); }
  .rating-btn.again:hover { background: var(--again-soft); }
  .rating-btn.hard  { color: var(--hard);  border-color: rgba(251, 191, 36, 0.35); }
  .rating-btn.hard:hover  { background: var(--accent-soft); }
  .rating-btn.good  { color: var(--good);  border-color: rgba(52, 211, 153, 0.35); }
  .rating-btn.good:hover  { background: var(--good-soft); }
  .rating-btn.easy  { color: var(--easy);  border-color: rgba(96, 165, 250, 0.35); }
  .rating-btn.easy:hover  { background: rgba(96, 165, 250, 0.12); }
  .rating-interval {
    font-size: 10px;
    font-weight: 500;
    color: var(--text-dim);
    letter-spacing: 0.04em;
  }

  .flip-prompt {
    display: flex;
    justify-content: center;
    margin-top: 20px;
  }
  .flip-btn {
    appearance: none;
    background: var(--text);
    color: var(--bg);
    border: none;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    padding: 14px 32px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 80ms, background 150ms;
    letter-spacing: 0.01em;
  }
  .flip-btn:active { transform: scale(0.98); }
  .flip-btn:hover { background: #e4e4e7; }

  /* ---------- Session complete ---------- */
  .session-done {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px;
  }
  .done-emoji { font-size: 48px; margin-bottom: 16px; }
  .done-title { font-size: 24px; font-weight: 600; margin-bottom: 8px; letter-spacing: -0.01em; }
  .done-sub { color: var(--text-muted); margin-bottom: 32px; max-width: 280px; line-height: 1.5; }
  .done-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 360px;
    margin-bottom: 32px;
  }
  .done-stat-val { font-size: 22px; font-weight: 600; }
  .done-stat-lbl { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 4px; }

  .primary-btn {
    appearance: none;
    background: var(--text);
    color: var(--bg);
    border: none;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    padding: 14px 28px;
    border-radius: 12px;
    cursor: pointer;
    transition: transform 80ms;
  }
  .primary-btn:active { transform: scale(0.98); }

  /* ---------- Stats / Settings ---------- */
  .section-title {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 20px;
    padding-top: 4px;
  }
  .settings-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }
  .settings-row:last-child { border-bottom: none; }
  .settings-label { font-size: 15px; }
  .settings-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .settings-value {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 8px;
    text-align: right;
    width: 80px;
  }

  .danger-btn {
    appearance: none;
    background: none;
    border: 1px solid var(--again);
    color: var(--again);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
  }

  /* ---------- Undo button ---------- */
  .undo-btn {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    padding: 6px 10px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: color 150ms, background 150ms, opacity 150ms;
  }
  .undo-btn:hover:not(:disabled) { color: var(--text); background: var(--surface); }
  .undo-btn:disabled { opacity: 0.25; cursor: default; }
  .undo-btn .undo-glyph { font-size: 16px; line-height: 1; }

  /* ---------- Deck Detail ---------- */
  .deck-detail-header {
    padding: 6px 0 20px;
  }
  .deck-detail-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .deck-detail-sub {
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 0.02em;
  }
  .deck-stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }
  .mini-stat {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
  }
  .mini-stat-lbl {
    font-size: 10px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 6px;
  }
  .mini-stat-val {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .mini-stat-val .sub {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-muted);
    margin-left: 4px;
  }
  .study-cta {
    width: 100%;
    background: var(--text);
    color: var(--bg);
    border: none;
    font-family: var(--font-ui);
    font-size: 15px;
    font-weight: 600;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    margin-bottom: 26px;
    letter-spacing: 0.01em;
    transition: transform 80ms, background 150ms;
  }
  .study-cta:hover:not(:disabled) { background: #e4e4e7; }
  .study-cta:active:not(:disabled) { transform: scale(0.99); }
  .study-cta:disabled { opacity: 0.35; cursor: default; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 8px;
    margin-bottom: 24px;
  }
  .card-tile {
    appearance: none;
    aspect-ratio: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 6px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: background 150ms, border-color 150ms, transform 80ms;
  }
  .card-tile:hover { background: var(--surface-2); border-color: var(--text-dim); }
  .card-tile:active { transform: scale(0.96); }
  .card-tile-kanji {
    font-family: var(--font-jp);
    font-size: 32px;
    line-height: 1;
    font-weight: 400;
  }
  .card-tile-keyword {
    font-size: 9px;
    color: var(--text-dim);
    margin-top: 4px;
    text-align: center;
    letter-spacing: 0.02em;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .status-dot {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
  }
  .status-dot.new { background: var(--text-dim); opacity: 0.35; }
  .status-dot.learning { background: var(--accent); }
  .status-dot.due { background: var(--again); }
  .status-dot.mastered { background: var(--good); }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-bottom: 16px;
    font-size: 11px;
    color: var(--text-dim);
  }
  .legend-item { display: inline-flex; align-items: center; gap: 5px; }
  .legend-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    display: inline-block;
  }

  /* ---------- Peek modal ---------- */
  .peek-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn 200ms ease;
  }
  .peek-card {
    position: relative;
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px;
    max-height: 85vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .peek-kanji {
    font-family: var(--font-jp);
    font-size: 96px;
    line-height: 1;
    text-align: center;
    padding: 12px 0 4px;
  }
  .peek-close {
    position: absolute;
    top: 12px;
    right: 14px;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 22px;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
  }
  .peek-close:hover { color: var(--text); }
  .peek-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 16px;
    margin-top: 4px;
  }
  .peek-nav-btn {
    appearance: none;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    padding: 6px 16px;
    border-radius: 8px;
    transition: background 120ms;
  }
  .peek-nav-btn:hover { background: var(--surface-3); }
  .peek-nav-btn:disabled { opacity: 0.28; cursor: default; }
  .peek-nav-counter {
    font-size: 12px;
    color: var(--text-muted);
    min-width: 52px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .fade-in { animation: fadeIn 300ms ease; }

  @media (max-width: 380px) {
    .shell { padding-left: 16px; padding-right: 16px; }
    .big-title { font-size: 28px; }
    .kanji-huge { font-size: 200px; }
  }

  /* ---------- Home tabs ---------- */
  .home-tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 3px;
    margin-bottom: 20px;
    gap: 3px;
  }
  .home-tab {
    flex: 1;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 13px;
    font-weight: 500;
    padding: 8px 0;
    border-radius: 7px;
    cursor: pointer;
    transition: all 150ms;
  }
  .home-tab.active { background: var(--surface-3); color: var(--text); }

  /* ---------- Vocab card front ---------- */
  .vocab-front { align-items: center; justify-content: center; gap: 14px; }
  .vocab-word {
    font-family: var(--font-jp);
    font-size: clamp(52px, 16vw, 88px);
    font-weight: 500;
    line-height: 1.1;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .vocab-reading {
    font-family: var(--font-jp);
    font-size: clamp(18px, 5vw, 24px);
    color: var(--text-muted);
    text-align: center;
  }

  /* ---------- Vocab example sentence ---------- */
  .vocab-example {
    padding: 10px 12px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .vocab-example-label {
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 2px;
  }
  .vocab-example-jp {
    font-family: var(--font-jp);
    font-size: 14px;
    color: var(--text);
    line-height: 1.6;
  }
  .vocab-example-reading {
    font-family: var(--font-jp);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.4;
  }
  .vocab-example-en {
    font-size: 12px;
    color: var(--text-muted);
    font-style: italic;
    line-height: 1.4;
  }

  /* ---------- Export reminder banner ---------- */
  .export-banner {
    background: var(--accent-soft);
    border: 1px solid rgba(251,191,36,0.3);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.45;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }
  .export-banner-btns { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .export-banner-cta {
    appearance: none;
    background: var(--accent);
    color: #000;
    border: none;
    font-family: var(--font-ui);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
  }
  .export-banner-dismiss {
    appearance: none;
    background: none;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    cursor: pointer;
    padding: 2px 4px;
    line-height: 1;
  }

  /* ---------- Filter chips ---------- */
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }
  .filter-chip {
    appearance: none;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    font-family: var(--font-ui);
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 150ms;
    letter-spacing: 0.04em;
  }
  .filter-chip.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
  }
</style>

","jlpt":"N3","example_sentence":"きのう引っ越してきたよつばです！","example_reading":"きのう ひっこして きた よつばです！","example_meaning":"I'm Yotsuba — I moved in yesterday!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"moving house","etymology":"The manga opens with Yotsuba moving into a new neighbourhood. This word and its verb form 引っ越す appear in the very first pages and recur throughout volume 1."},{"kanji":"ご近所","meanings":["neighbourhood","the neighbours (polite)"],"reading":"ごきんじょ","category":"neighbourhood","context":"Used when Yotsuba or Koiwai introduce themselves to the Ayase family next door. The polite prefix ご is important for understanding register.","jlpt":"N3","example_sentence":"ご近所に挨拶に行こう。","example_reading":"ごきんじょ に あいさつ に いこう。","example_meaning":"Let's go introduce ourselves to the neighbours.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"neighbourhood","etymology":"Used when Yotsuba or Koiwai introduce themselves to the Ayase family next door. The polite prefix ご is important for understanding register."},{"kanji":"挨拶","meanings":["greeting","salutation","introduction visit"],"reading":"あいさつ","category":"neighbourhood","context":"The kanji for 挨拶 are notoriously difficult and rarely written even by native speakers. Recognise the word by sound; don't stress about writing the kanji.","jlpt":"N3","example_sentence":"引っ越しの挨拶をする。","example_reading":"ひっこし の あいさつ を する。","example_meaning":"To pay a moving-in greeting visit.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"greeting","etymology":"The kanji for 挨拶 are notoriously difficult and rarely written even by native speakers. Recognise the word by sound; don't stress about writing the kanji."},{"kanji":"お邪魔します","meanings":["excuse me for intruding","sorry to bother you (said when entering someone's home)"],"reading":"おじゃまします","category":"colloquial","context":"Said every time a character enters the Ayase house. If you don't know this phrase you will be confused by a sentence with no obvious literal meaning.","jlpt":"N3","example_sentence":"お邪魔します！と言ってから家に入った。","example_reading":"おじゃまします！ と いって から いえ に はいった。","example_meaning":"She said 'excuse me for intruding!' and then entered the house.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"excuse me for intruding","etymology":"Said every time a character enters the Ayase house. If you don't know this phrase you will be confused by a sentence with no obvious literal meaning."},{"kanji":"仕方ない","meanings":["can't be helped","nothing to be done","it is what it is"],"reading":"しかたない","category":"colloquial","context":"A very common expression in casual Japanese that N3 learners often see but mis-parse. Also appears as しょうがない in the manga.","jlpt":"N3","example_sentence":"雨が降ってきた。仕方ないね。","example_reading":"あめ が ふって きた。しかたない ね。","example_meaning":"It started raining. Oh well, nothing we can do.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"can't be helped","etymology":"A very common expression in casual Japanese that N3 learners often see but mis-parse. Also appears as しょうがない in the manga."},{"kanji":"当たり前","meanings":["natural","obvious","of course","taken for granted"],"reading":"あたりまえ","category":"colloquial","context":"Characters use this frequently in exasperated or matter-of-fact replies. Yanda and Jumbo use it a lot when Yotsuba asks naive questions.","jlpt":"N3","example_sentence":"当たり前だろ！知ってるよ！","example_reading":"あたりまえ だろ！しってるよ！","example_meaning":"Of course! I know that!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"natural","etymology":"Characters use this frequently in exasperated or matter-of-fact replies. Yanda and Jumbo use it a lot when Yotsuba asks naive questions."},{"kanji":"不思議","meanings":["mysterious","strange","wonderful","curious"],"reading":"ふしぎ","category":"emotions","context":"Yotsuba finds everything mysterious and wonderful — this word captures her worldview. It appears both as a な-adjective (不思議な) and as a noun.","jlpt":"N3","example_sentence":"よつばは不思議な子だな。","example_reading":"よつば は ふしぎ な こ だな。","example_meaning":"Yotsuba is a mysterious/curious kid, isn't she.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"mysterious","etymology":"Yotsuba finds everything mysterious and wonderful — this word captures her worldview. It appears both as a な-adjective (不思議な) and as a noun."},{"kanji":"素直","meanings":["honest","obedient","straightforward","naive and pure"],"reading":"すなお","category":"emotions","context":"Used by adult characters to describe Yotsuba's honest, uncomplicated nature. Contrasts with more 'knowing' children.","jlpt":"N2","example_sentence":"よつばは素直でいい子だ。","example_reading":"よつば は すなお で いい こ だ。","example_meaning":"Yotsuba is an honest, good girl.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"honest","etymology":"Used by adult characters to describe Yotsuba's honest, uncomplicated nature. Contrasts with more 'knowing' children."},{"kanji":"迷子","meanings":["lost child","person who has lost their way"],"reading":"まいご","category":"everyday_life","context":"Appears in the amusement park volume when Yotsuba gets separated. The kanji combination 迷子 is a fixed compound — the reading まいご is not predictable from the individual kanji readings.","jlpt":"N3","example_sentence":"よつばが迷子になった！","example_reading":"よつば が まいご に なった！","example_meaning":"Yotsuba got lost!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"lost child","etymology":"Appears in the amusement park volume when Yotsuba gets separated. The kanji combination 迷子 is a fixed compound — the reading まいご is not predictable from the individual kanji readings."},{"kanji":"約束","meanings":["promise","appointment","arrangement"],"reading":"やくそく","category":"everyday_life","context":"Yotsuba makes and reports promises constantly. Included because N3 learners sometimes still mix up the kanji reading.","jlpt":"N4","example_sentence":"じゃあ約束だよ！明日また来るからね。","example_reading":"じゃあ やくそく だよ！あした また くる から ね。","example_meaning":"OK it's a promise! I'll come again tomorrow.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"promise","etymology":"Yotsuba makes and reports promises constantly. Included because N3 learners sometimes still mix up the kanji reading."},{"kanji":"縁側","meanings":["veranda","wooden corridor/platform along the edge of a traditional Japanese house"],"reading":"えんがわ","category":"home","context":"The Ayase house has a traditional 縁側 where characters sit and chat. The word is culturally important for understanding scene-setting in classic Japanese homes.","jlpt":"N1","example_sentence":"おばあちゃんは縁側に座って庭を見ていた。","example_reading":"おばあちゃん は えんがわ に すわって にわ を みていた。","example_meaning":"Grandma was sitting on the veranda looking at the garden.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"veranda","etymology":"The Ayase house has a traditional 縁側 where characters sit and chat. The word is culturally important for understanding scene-setting in classic Japanese homes."},{"kanji":"片付ける","meanings":["to tidy up","to put away","to clean up","to deal with"],"reading":"かたづける","category":"home","context":"Koiwai and the Ayase sisters use this constantly when ordering Yotsuba to clean up or when tidying after activities.","jlpt":"N3","example_sentence":"遊んだあとはちゃんと片付けること！","example_reading":"あそんだ あとは ちゃんと かたづける こと！","example_meaning":"Make sure you tidy up properly after playing!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to tidy up","etymology":"Koiwai and the Ayase sisters use this constantly when ordering Yotsuba to clean up or when tidying after activities."},{"kanji":"洗濯","meanings":["laundry","washing clothes"],"reading":"せんたく","category":"home","context":"Appears in domestic scenes. N3 learners often know this word in hiragana but struggle to recognise the kanji quickly in manga panels.","jlpt":"N4","example_sentence":"よつばもお父さんの洗濯を手伝った。","example_reading":"よつば も おとうさん の せんたく を てつだった。","example_meaning":"Yotsuba helped her dad with the laundry too.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"laundry","etymology":"Appears in domestic scenes. N3 learners often know this word in hiragana but struggle to recognise the kanji quickly in manga panels."},{"kanji":"手伝う","meanings":["to help","to assist","to lend a hand"],"reading":"てつだう","category":"everyday_life","context":"Yotsuba insists on helping with everything. This verb recurs constantly. The ず→う verb conjugation trips up learners.","jlpt":"N4","example_sentence":"よつばも手伝う！","example_reading":"よつば も てつだう！","example_meaning":"Yotsuba will help too!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to help","etymology":"Yotsuba insists on helping with everything. This verb recurs constantly. The ず→う verb conjugation trips up learners."},{"kanji":"布団","meanings":["futon","Japanese padded bedding"],"reading":"ふとん","category":"home","context":"Appears in morning scenes and sleep-over sequences. The kanji 布団 have unusual readings and are worth memorising as a pair.","jlpt":"N3","example_sentence":"布団を干さないといけないな。","example_reading":"ふとん を ほさない と いけない な。","example_meaning":"I really should air out the futon.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"futon","etymology":"Appears in morning scenes and sleep-over sequences. The kanji 布団 have unusual readings and are worth memorising as a pair."},{"kanji":"買い物","meanings":["shopping","purchasing"],"reading":"かいもの","category":"everyday_life","context":"Yotsuba goes shopping with Koiwai and the Ayase family. N3 learners know this word but sometimes falter on 物 readings (もの vs もの in compounds).","jlpt":"N4","example_sentence":"よつばとジャンボで買い物に行くことにした。","example_reading":"よつば と じゃんぼ で かいもの に いく こと に した。","example_meaning":"We decided to go shopping with Yotsuba and Jumbo.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"shopping","etymology":"Yotsuba goes shopping with Koiwai and the Ayase family. N3 learners know this word but sometimes falter on 物 readings (もの vs もの in compounds)."},{"kanji":"虫取り","meanings":["bug catching","insect collecting"],"reading":"むしとり","category":"nature","context":"A key activity across volumes 2 and 3. This compound is transparent once you know 虫（むし）and 取る（とる）, but learners often don't connect the pieces in kanji form.","jlpt":"N1","example_sentence":"虫取りに行こう！網持ってきた？","example_reading":"むしとり に いこう！あみ もって きた？","example_meaning":"Let's go bug catching! Did you bring the net?","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"bug catching","etymology":"A key activity across volumes 2 and 3. This compound is transparent once you know 虫（むし）and 取る（とる）, but learners often don't connect the pieces in kanji form."},{"kanji":"セミ","meanings":["cicada"],"reading":"せみ","category":"nature","context":"Summer chapters are defined by cicada sounds and catching them. Written in katakana in the manga. Even if learners know the word they may not know the cultural weight — cicadas signal summer in Japan.","jlpt":"N1","example_sentence":"セミがうるさいくらい鳴いている。","example_reading":"せみ が うるさい くらい ないて いる。","example_meaning":"The cicadas are crying so loud it's almost too much.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"cicada","etymology":"Summer chapters are defined by cicada sounds and catching them. Written in katakana in the manga. Even if learners know the word they may not know the cultural weight — cicadas signal summer in Japan."},{"kanji":"遊園地","meanings":["amusement park","theme park"],"reading":"ゆうえんち","category":"activities","context":"An entire volume arc is set at an amusement park. The word is made of logical parts (遊＋園＋地) but the compound itself is its own vocabulary item.","jlpt":"N3","example_sentence":"初めて遊園地に来た！すごい！","example_reading":"はじめて ゆうえんち に きた！すごい！","example_meaning":"I came to an amusement park for the first time! Amazing!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"amusement park","etymology":"An entire volume arc is set at an amusement park. The word is made of logical parts (遊＋園＋地) but the compound itself is its own vocabulary item."},{"kanji":"農家","meanings":["farming household","farmer's house","farm family"],"reading":"のうか","category":"neighbourhood","context":"Appears when Yotsuba visits Fuuka's grandmother's house in the countryside. Helps understand the rural-vs-city contrast the manga uses.","jlpt":"N2","example_sentence":"ここは農家だから野菜が新鮮だよ。","example_reading":"ここ は のうか だ から やさい が しんせん だよ。","example_meaning":"This is a farming household so the vegetables are fresh.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"farming household","etymology":"Appears when Yotsuba visits Fuuka's grandmother's house in the countryside. Helps understand the rural-vs-city contrast the manga uses."},{"kanji":"散歩","meanings":["walk","stroll"],"reading":"さんぽ","category":"activities","context":"Included because N3 learners sometimes confuse 歩く（あるく）with 散歩（さんぽ）in nuance — 散歩 is a leisure stroll, not just walking.","jlpt":"N4","example_sentence":"よつば、散歩に行くぞ。","example_reading":"よつば、さんぽ に いくぞ。","example_meaning":"Yotsuba, we're going for a walk.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"walk","etymology":"Included because N3 learners sometimes confuse 歩く（あるく）with 散歩（さんぽ）in nuance — 散歩 is a leisure stroll, not just walking."},{"kanji":"翌日","meanings":["the next day","the following day"],"reading":"よくじつ","category":"everyday_life","context":"Used in narrative transitions between chapters. N3 learners know 明日 but often don't recognise the more formal 翌日 in captions.","jlpt":"N2","example_sentence":"翌日の朝、よつばは早起きした。","example_reading":"よくじつ の あさ、よつば は はやおき した。","example_meaning":"The following morning, Yotsuba woke up early.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"the next day","etymology":"Used in narrative transitions between chapters. N3 learners know 明日 but often don't recognise the more formal 翌日 in captions."},{"kanji":"電線","meanings":["power line","electric wire","telephone line"],"reading":"でんせん","category":"neighbourhood","context":"Appears in background description of the suburban street setting. Yotsuba notices them. The compound 電線 is straightforward (電＋線) for learners who know both kanji.","jlpt":"N1","example_sentence":"電線にカラスが止まっている。","example_reading":"でんせん に からす が とまって いる。","example_meaning":"A crow is perched on the power line.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"power line","etymology":"Appears in background description of the suburban street setting. Yotsuba notices them. The compound 電線 is straightforward (電＋線) for learners who know both kanji."},{"kanji":"自転車","meanings":["bicycle"],"reading":"じてんしゃ","category":"activities","context":"Yotsuba learns to ride a bicycle. This compound (自＋転＋車) has three kanji with readings N3 learners may not have fully fixed — worth drilling the reading as a whole word.","jlpt":"N4","example_sentence":"よつばは自転車に乗れるようになった！","example_reading":"よつば は じてんしゃ に のれる ように なった！","example_meaning":"Yotsuba has become able to ride a bicycle!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"bicycle","etymology":"Yotsuba learns to ride a bicycle. This compound (自＋転＋車) has three kanji with readings N3 learners may not have fully fixed — worth drilling the reading as a whole word."},{"kanji":"牛乳","meanings":["cow's milk","milk"],"reading":"ぎゅうにゅう","category":"everyday_life","context":"Appears in grocery and breakfast scenes. N3 learners often know the word but confuse 牛（ぎゅう）with 牛（うし）and 乳（にゅう）vs 乳（ちち）readings.","jlpt":"N4","example_sentence":"朝は牛乳を飲むといいぞ。","example_reading":"あさ は ぎゅうにゅう を のむ と いいぞ。","example_meaning":"Drinking milk in the morning is good for you.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"cow's milk","etymology":"Appears in grocery and breakfast scenes. N3 learners often know the word but confuse 牛（ぎゅう）with 牛（うし）and 乳（にゅう）vs 乳（ちち）readings."},{"kanji":"はしゃぐ","meanings":["to frolic","to be overexcited","to make a racket from excitement"],"reading":"はしゃぐ","category":"emotions","context":"Perfectly describes Yotsuba's typical behaviour everywhere. This verb is very common in descriptions of children or excitable characters in manga.","jlpt":"N2","example_sentence":"よつばははしゃいで庭を走り回った。","example_reading":"よつば は はしゃいで にわ を はしりまわった。","example_meaning":"Yotsuba was excitedly running around the garden.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to frolic","etymology":"Perfectly describes Yotsuba's typical behaviour everywhere. This verb is very common in descriptions of children or excitable characters in manga."},{"kanji":"ぼんやり","meanings":["absent-mindedly","vaguely","hazily","spaced out"],"reading":"ぼんやり","category":"onomatopoeia","context":"Used to describe a character staring into space or thinking vaguely. Adult characters (especially Koiwai) often 'ぼんやりする' in contrast to Yotsuba's energy.","jlpt":"N2","example_sentence":"お父さんはぼんやりと空を見上げていた。","example_reading":"おとうさん は ぼんやり と そら を みあげて いた。","example_meaning":"Dad was staring up at the sky absent-mindedly.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"absent-mindedly","etymology":"Used to describe a character staring into space or thinking vaguely. Adult characters (especially Koiwai) often 'ぼんやりする' in contrast to Yotsuba's energy."},{"kanji":"うろうろ","meanings":["wandering around aimlessly","milling about"],"reading":"うろうろ","category":"onomatopoeia","context":"Yotsuba うろうろs constantly — in the new neighbourhood, in shops, at events. This mimetic word will appear in almost every volume.","jlpt":"N2","example_sentence":"よつばが知らない道をうろうろしていた。","example_reading":"よつば が しらない みち を うろうろ して いた。","example_meaning":"Yotsuba was wandering around on an unfamiliar street.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"wandering around aimlessly","etymology":"Yotsuba うろうろs constantly — in the new neighbourhood, in shops, at events. This mimetic word will appear in almost every volume."},{"kanji":"わくわく","meanings":["excited","thrilled","with anticipation (positive)"],"reading":"わくわく","category":"onomatopoeia","context":"Yotsuba's default state. This mimetic word pairs constantly with する: わくわくする. N3 learners often know it but don't recognise it in context without the する.","jlpt":"N3","example_sentence":"明日の遠足がわくわくする！","example_reading":"あした の えんそく が わくわく する！","example_meaning":"I'm so excited about tomorrow's field trip!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"excited","etymology":"Yotsuba's default state. This mimetic word pairs constantly with する: わくわくする. N3 learners often know it but don't recognise it in context without the する."},{"kanji":"どきどき","meanings":["heart pounding","nervous excitement","thudding heartbeat"],"reading":"どきどき","category":"onomatopoeia","context":"Used for moments of nervous excitement — Yotsuba at the amusement park, or when someone is waiting for something scary/exciting.","jlpt":"N3","example_sentence":"お化け屋敷の前でどきどきしてきた。","example_reading":"おばけやしき の まえ で どきどき して きた。","example_meaning":"My heart started pounding in front of the haunted house.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"heart pounding","etymology":"Used for moments of nervous excitement — Yotsuba at the amusement park, or when someone is waiting for something scary/exciting."},{"kanji":"ぴかぴか","meanings":["sparkling clean","gleaming","brand new and shiny"],"reading":"ぴかぴか","category":"onomatopoeia","context":"Used when describing things that are very clean or new. Yotsuba uses it to describe things she finds impressively shiny or pristine.","jlpt":"N2","example_sentence":"よつばの靴はぴかぴかだ。","example_reading":"よつば の くつ は ぴかぴか だ。","example_meaning":"Yotsuba's shoes are gleaming clean.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"sparkling clean","etymology":"Used when describing things that are very clean or new. Yotsuba uses it to describe things she finds impressively shiny or pristine."},{"kanji":"ぐるぐる","meanings":["spinning round and round","going in circles","wrapped around repeatedly"],"reading":"ぐるぐる","category":"onomatopoeia","context":"Appears for spinning rides at the amusement park and for Yotsuba twirling. The distinction between ぐるぐる (bigger/dizzying) and くるくる (smaller/cuter) is a useful nuance.","jlpt":"N2","example_sentence":"メリーゴーランドがぐるぐる回っている。","example_reading":"めりーごーらんど が ぐるぐる まわって いる。","example_meaning":"The merry-go-round is spinning round and round.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"spinning round and round","etymology":"Appears for spinning rides at the amusement park and for Yotsuba twirling. The distinction between ぐるぐる (bigger/dizzying) and くるくる (smaller/cuter) is a useful nuance."},{"kanji":"くすくす","meanings":["giggling","chuckling quietly","suppressed laughter"],"reading":"くすくす","category":"onomatopoeia","context":"The Ayase sisters くすくす when Yotsuba does something unexpectedly funny. Useful for distinguishing different types of laughter in manga SFX.","jlpt":"N2","example_sentence":"あさぎはくすくすと笑った。","example_reading":"あさぎ は くすくす と わらった。","example_meaning":"Asagi giggled softly.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"giggling","etymology":"The Ayase sisters くすくす when Yotsuba does something unexpectedly funny. Useful for distinguishing different types of laughter in manga SFX."},{"kanji":"いたずら","meanings":["mischief","prank","naughty trick"],"reading":"いたずら","category":"everyday_life","context":"Often written in hiragana in the manga (いたずら) but the kanji form 悪戯 also appears occasionally. Yanda is described as いたずらっ子.","jlpt":"N2","example_sentence":"ヤンダはよつばにいたずらばかりする。","example_reading":"やんだ は よつば に いたずら ばかり する。","example_meaning":"Yanda does nothing but play tricks on Yotsuba.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"mischief","etymology":"Often written in hiragana in the manga (いたずら) but the kanji form 悪戯 also appears occasionally. Yanda is described as いたずらっ子."},{"kanji":"怒る","meanings":["to get angry","to be mad (おこる = colloquial; いかる = formal/literary)"],"reading":"おこる／いかる","category":"emotions","context":"Koiwai and the Ayase mother 怒る Yotsuba frequently. The two readings (おこる for casual use, いかる for literary/formal) confuse learners — in this manga it's always おこる.","jlpt":"N4","example_sentence":"よつばが怒ったって顔してる。","example_reading":"よつば が おこった って かお してる。","example_meaning":"Yotsuba's got an 'I'm angry' face on.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to get angry","etymology":"Koiwai and the Ayase mother 怒る Yotsuba frequently. The two readings (おこる for casual use, いかる for literary/formal) confuse learners — in this manga it's always おこる."},{"kanji":"謝る","meanings":["to apologise","to say sorry"],"reading":"あやまる","category":"emotions","context":"Yotsuba is made to apologise in several scenes. The kanji 謝 is also the 謝 in 感謝（かんしゃ）— connecting them helps retention.","jlpt":"N3","example_sentence":"ちゃんと謝りなさい！","example_reading":"ちゃんと あやまりなさい！","example_meaning":"Apologise properly!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to apologise","etymology":"Yotsuba is made to apologise in several scenes. The kanji 謝 is also the 謝 in 感謝（かんしゃ）— connecting them helps retention."},{"kanji":"がっかり","meanings":["disappointed","let down","disillusioned"],"reading":"がっかり","category":"emotions","context":"Yotsuba shows visible disappointment when plans fall through. Used as both an adverb (がっかりした顔) and verb phrase (がっかりする).","jlpt":"N3","example_sentence":"雨でキャンプが中止になってよつばはがっかりした。","example_reading":"あめ で きゃんぷ が ちゅうし に なって よつば は がっかり した。","example_meaning":"Yotsuba was disappointed that the camp was cancelled because of rain.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"disappointed","etymology":"Yotsuba shows visible disappointment when plans fall through. Used as both an adverb (がっかりした顔) and verb phrase (がっかりする)."},{"kanji":"なかよし","meanings":["good friends","close friends","on good terms"],"reading":"なかよし","category":"neighbourhood","context":"Written both as 仲良し and なかよし. The kanji form surprises learners who only know the hiragana. Yotsuba rapidly becomes なかよし with all the neighbours.","jlpt":"N3","example_sentence":"よつばとあさぎはすぐなかよしになった。","example_reading":"よつば と あさぎ は すぐ なかよし に なった。","example_meaning":"Yotsuba and Asagi quickly became good friends.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"good friends","etymology":"Written both as 仲良し and なかよし. The kanji form surprises learners who only know the hiragana. Yotsuba rapidly becomes なかよし with all the neighbours."},{"kanji":"よその","meanings":["someone else's","another family's","a stranger's","other people's"],"reading":"よその","category":"colloquial","context":"よその子、よその家 — appears when adults remind Yotsuba of boundaries between her own home and neighbours'. A culturally loaded term about in-group vs out-group.","jlpt":"N2","example_sentence":"よその家に勝手に入ってはいけないよ。","example_reading":"よそ の いえ に かってに はいって は いけない よ。","example_meaning":"You mustn't go into someone else's house without asking.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"someone else's","etymology":"よその子、よその家 — appears when adults remind Yotsuba of boundaries between her own home and neighbours'. A culturally loaded term about in-group vs out-group."},{"kanji":"かっこいい","meanings":["cool","stylish","handsome","awesome-looking"],"reading":"かっこいい","category":"colloquial","context":"Yotsuba calls Jumbo and others かっこいい. The word comes from 格好（かっこう）+ いい but is only written in kana in colloquial use. N3 learners sometimes don't know the kanji origin.","jlpt":"N4","example_sentence":"ジャンボはかっこいいな！","example_reading":"じゃんぼ は かっこいい な！","example_meaning":"Jumbo is so cool!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"cool","etymology":"Yotsuba calls Jumbo and others かっこいい. The word comes from 格好（かっこう）+ いい but is only written in kana in colloquial use. N3 learners sometimes don't know the kanji origin."},{"kanji":"ばかにする","meanings":["to make fun of","to look down on","to treat as stupid"],"reading":"ばかにする","category":"emotions","context":"Yotsuba accuses Yanda of ばかにする-ing her. The expression is colloquial and written in kana or kanji in the manga.","jlpt":"N2","example_sentence":"ヤンダ、よつばのことばかにしてる！","example_reading":"やんだ、よつば の こと ばかに してる！","example_meaning":"Yanda is making fun of Yotsuba!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to make fun of","etymology":"Yotsuba accuses Yanda of ばかにする-ing her. The expression is colloquial and written in kana or kanji in the manga."},{"kanji":"うなずく","meanings":["to nod","to nod in agreement"],"reading":"うなずく","category":"everyday_life","context":"Often written in hiragana in manga. The kanji form 頷く is rarely used but exists. Appears in narrator captions when Yotsuba or other characters agree silently.","jlpt":"N2","example_sentence":"よつばは大きくうなずいた。","example_reading":"よつば は おおきく うなずいた。","example_meaning":"Yotsuba gave a big nod.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"to nod","etymology":"Often written in hiragana in manga. The kanji form 頷く is rarely used but exists. Appears in narrator captions when Yotsuba or other characters agree silently."},{"kanji":"一人暮らし","meanings":["living alone","single-person household"],"reading":"ひとりぐらし","category":"everyday_life","context":"Referenced in early volumes when Koiwai's lifestyle is being established. The compound 暮らし（ぐらし）is an important suffix to know as it appears in many compounds.","jlpt":"N2","example_sentence":"お父さんは前は一人暮らしだった。","example_reading":"おとうさん は まえ は ひとりぐらし だった。","example_meaning":"Dad used to live alone.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"living alone","etymology":"Referenced in early volumes when Koiwai's lifestyle is being established. The compound 暮らし（ぐらし）is an important suffix to know as it appears in many compounds."},{"kanji":"おでかけ","meanings":["outing","going out","trip (casual / child-friendly register)"],"reading":"おでかけ","category":"activities","context":"Used constantly in child-directed speech. The polite prefix お + 出かけ. N3 learners know 出かける but may not recognise the noun form おでかけ.","jlpt":"N3","example_sentence":"今日はどこにおでかけするの？","example_reading":"きょう は どこ に おでかけ する の？","example_meaning":"Where are we going today?","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"outing","etymology":"Used constantly in child-directed speech. The polite prefix お + 出かけ. N3 learners know 出かける but may not recognise the noun form おでかけ."},{"kanji":"風車","meanings":["windmill","wind turbine"],"reading":"ふうしゃ","category":"nature","context":"Appears in countryside scenes and in Yotsuba's toy pinwheels. Note that the toy pinwheel version is often called かざぐるま (風車 with different reading) — same kanji, different reading.","jlpt":"N1","example_sentence":"遠くに大きな風車が見える。","example_reading":"とおく に おおきな ふうしゃ が みえる。","example_meaning":"You can see a large windmill in the distance.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"windmill","etymology":"Appears in countryside scenes and in Yotsuba's toy pinwheels. Note that the toy pinwheel version is often called かざぐるま (風車 with different reading) — same kanji, different reading."},{"kanji":"神社","meanings":["Shinto shrine"],"reading":"じんじゃ","category":"neighbourhood","context":"The neighbourhood shrine features in several scenes. The reading じんじゃ is straightforward but the kanji 社（しゃ）has multiple readings that trip N3 learners.","jlpt":"N3","example_sentence":"神社の前で記念写真を撮った。","example_reading":"じんじゃ の まえ で きねんしゃしん を とった。","example_meaning":"We took a commemorative photo in front of the shrine.","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"Shinto shrine","etymology":"The neighbourhood shrine features in several scenes. The reading じんじゃ is straightforward but the kanji 社（しゃ）has multiple readings that trip N3 learners."},{"kanji":"公園","meanings":["park","public park"],"reading":"こうえん","category":"activities","context":"Included because N3 learners sometimes confuse 公園（こうえん）with 公演（こうえん = public performance) — homophones. Context in Yotsuba always means park.","jlpt":"N4","example_sentence":"公園でブランコに乗ろう！","example_reading":"こうえん で ぶらんこ に のろう！","example_meaning":"Let's ride the swings at the park!","on_yomi":[],"kun_yomi":[],"examples":[],"keyword":"park","etymology":"Included because N3 learners sometimes confu
